services:
  - type: web
    name: email-intelligence-api
    runtime: go
    rootDir: email-checker-backend
    buildCommand: go build -tags netgo -ldflags="-s -w" -o app .
    startCommand: ./app
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: GO111MODULE
        value: on
      - key: CORS_ALLOWED_ORIGINS
        value: https://email-intelligence-platform-eora-3d3gdricp.vercel.app,https://email-intelligence-platform-eora.vercel.app,https://email-intelligence-platform.vercel.app,http://localhost:3000
    healthCheckPath: /api/v1/health
